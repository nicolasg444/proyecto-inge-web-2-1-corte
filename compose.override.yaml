# compose.override.yaml - SOLO DESARROLLO.
# "docker compose up" lo aplica encima de compose.yaml. Para modo
# produccion: docker compose -f compose.yaml up -d
services:
  api:
    # Codigo montado desde el equipo (solo lectura para el contenedor) y
    # node --watch reinicia al guardar: no hay que reconstruir la imagen.
    volumes:
      - ./server.js:/app/server.js:ro
      - ./config.js:/app/config.js:ro
      - ./cache.js:/app/cache.js:ro
      - ./firebase-rest.js:/app/firebase-rest.js:ro
      - ./js/trip-simulation.js:/app/js/trip-simulation.js:ro
    command: ["node", "--watch", "server.js"]
    read_only: false
    # API directa (sin Nginx) solo desde este equipo.
    ports:
      - "127.0.0.1:8000:8000"
  web:
    # Cambios en HTML/CSS/JS visibles al recargar el navegador.
    volumes:
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
