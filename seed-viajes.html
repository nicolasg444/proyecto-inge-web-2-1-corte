<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sembrar viajes | WayTure</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #071827;
      color: #f7fbff;
    }

    main {
      width: min(760px, 100%);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #102033;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    button,
    a {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      color: #fff;
      background: linear-gradient(135deg, #37b7ee, #2f6df6);
    }

    a {
      color: #d9ecff;
      background: rgba(255, 255, 255, 0.08);
    }

    pre {
      min-height: 160px;
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: #07111f;
      color: #c9f7dd;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Datos simulados WayTure</h1>
    <p>Inicia sesion con tu cuenta admin y guarda viajes reales en Firestore.</p>
    <div class="actions">
      <button id="seedTripsBtn" type="button">Guardar datos simulados</button>
      <a href="admin-viajes.html#panel">Ir al panel admin</a>
      <a href="login.html">Login</a>
    </div>
    <pre id="seedOutput">Esperando accion...</pre>
  </main>
  <script type="module" src="js/seed-viajes.js"></script>
</body>
</html>
