# Reenvio a la API. "api" es el nombre del servicio en Compose y del Service
# en Kubernetes: el mismo archivo sirve en los dos entornos.
#
# SIN barra final en proxy_pass: la ruta llega intacta (/api/viajes ->
# /api/viajes). Con "http://api:8000/" Nginx quitaria el prefijo /api/ y la
# API (cuyas rutas empiezan por /api/) responderia 404.
proxy_pass http://api:8000;

# Host original y datos del cliente real (si no, la API veria la IP de Nginx).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Authorization (JWT), Cookie (csrf_token) y X-CSRF-Token se reenvian por
# defecto, igual que Set-Cookie en la respuesta. Se dejan explicitas para la
# socializacion; $http_<nombre> es el valor recibido del navegador.
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_pass_header Set-Cookie;

# Las cabeceras de seguridad de la API vienen de server.js: aqui no se
# agrega ninguna (no duplicar).
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
