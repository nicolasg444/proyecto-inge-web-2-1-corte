# Servidor web de WayTure: estaticos + proxy a la API.
# Reemplaza /etc/nginx/conf.d/default.conf de nginxinc/nginx-unprivileged
# (su nginx.conf principal ya guarda pid y temporales en /tmp: por eso
# funciona con sistema de archivos raiz de solo lectura).

server {
    # 8080: un proceso sin privilegios no puede abrir puertos < 1024.
    listen 8080;
    server_name _;

    # No anunciar la version de Nginx.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Limite del cuerpo de las peticiones: el mismo 1 MB que aplica server.js.
    client_max_body_size 1m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }
    location = /health {
        include /etc/nginx/snippets/proxy-api.conf;
    }
    location = /quien {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Salud del propio Nginx, independiente de la API (si dependiera, una
    # caida de la API reiniciaria tambien los pods web sin motivo).
    location = /salud-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Estaticos ----------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # WayTure es multipagina (un .html por pantalla), sin enrutador del
        # lado del cliente: NO hace falta el fallback a index.html, y una
        # ruta inexistente debe ser un 404 real.
        try_files $uri $uri/ =404;
    }
}
