# Cabeceras de seguridad para los estaticos (HTML, JS, CSS, imagenes).
# Son EXACTAMENTE las de SECURITY_HEADERS en server.js: al servir los
# estaticos desde Nginx, server.js ya no los toca y estas cabeceras se
# perderian. Si cambias una politica, cambiala en los dos sitios
# (scripts/smoke-jwt.mjs verifica que ambas lleguen).
#
# Se incluye SOLO en las locations de estaticos, no a nivel server: si no,
# Nginx tambien las sumaria a las respuestas de la API (que ya traen las
# suyas desde server.js) y quedarian duplicadas: dos CSP = el navegador
# aplica la interseccion, y X-Frame-Options "DENY, DENY" es invalido.
# "always": tambien en respuestas de error (404, 500).
#
# CSP: mantiene los origenes que usa WayTure: unpkg.com (Leaflet),
# gstatic.com / googleapis.com (Firebase SDK y Google Maps),
# OpenStreetMap (teselas y Nominatim) y Firebase (firebaseio.com).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://www.gstatic.com https://www.googleapis.com https://maps.googleapis.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org wss://*.firebaseio.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com https://unpkg.com; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.firebase.com; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
